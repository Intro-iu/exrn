[package]
name = "exrn"
edition = "2021"
version = "0.1.0"
authors = ["Intro <Intro-iu@outlook.com>"]
license = "GPL-3.0"
description = "A simple terminal tool for renaming files"
readme = "README.md"
homepage = "https://github.com/Intro-iu/exrn"
repository = "https://github.com/Intro-iu/exrn"
keywords = ["cli", "rename"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
regex = "1.12.2"
glob = "0.3.3"
colored = "3.1.1"

[dev-dependencies]
tempfile = "3.24.0"
