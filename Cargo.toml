[package]
name = "exrn"
edition = "2021"
version = "0.1.0"
authors = ["Intro <Intro-iu@outlook.com>"]
license = "MIT"
description = "A Command-line File Renaming Tool Based on Regular Expressions"
readme = "README.md"
homepage = "https://github.com/Intro-iu/exrn"
repository = "https://github.com/Intro-iu/exrn.git"
keywords = ["rust", "commands", "command-line-tool", "regular-expressions", "renamer"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
regex = "1.12.2"
glob = "0.3.3"
colored = "3.1.1"
ratatui = "0.30.0"
crossterm = "0.29.0"
tui-textarea = "0.7.0"

[dev-dependencies]
tempfile = "3.24.0"
